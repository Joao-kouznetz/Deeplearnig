name: Validar EDA

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Reproduzir, testar e construir o site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
          cache: pip
      - name: Instalar dependências fixadas
        run: python -m pip install -r requirements.txt
      - name: Conferir estilo
        run: |
          ruff check docs/projects/eda/code tests
          ruff format --check docs/projects/eda/code tests
      - name: Reproduzir os resultados a partir dos dados oficiais
        run: python docs/projects/eda/code/analyze.py
      - name: Verificar contratos e resultados
        run: python -m pytest -q
      - name: Construir documentação sem avisos
        run: mkdocs build --strict
      - name: Disponibilizar site para revisão
        uses: actions/upload-artifact@v4
        with:
          name: site-eda
          path: site/
          retention-days: 30
